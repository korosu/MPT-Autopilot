# Copy this file to jobs.yaml and edit.
# jobs.yaml is gitignored — your video topics stay private.
#
# `mpt refill` appends generated jobs here; `mpt batch` renders the pending ones.
# With a language configured, --lang picks the file: langs.es.file_suffix "_es"
# means `mpt batch --lang es` reads jobs_es.yaml.
#
# `defaults` below lists every MoneyPrinterTurbo VideoParams field. You don't
# need to set them all — anything you delete here just isn't sent, and
# MoneyPrinterTurbo falls back to its own server-side default. This file is
# intentionally exhaustive so you have a single place to see what's tunable.

defaults:
  # ── Voice ────────────────────────────────────────────────────────────────
  # `voice` resolves a friendly alias from config.yaml's `batch.voices:` section
  # into voice_name (and voice_rate/voice_volume when the preset sets them), so
  # they can never drift out of sync. Ships with working presets already — see
  # config.example.yaml. You can set voice_name directly instead if you'd
  # rather skip presets entirely.
  # NOTE: tts_server is NOT a VideoParams field in MPT — it never reaches the
  # payload; it only labels presets in `mpt batch --list-voices`.
  voice: "gemini_puck"
  voice_volume: 1                 # final-mix amplification, NOT TTS loudness (>1 clips: MPT has no limiter)
  voice_rate: 1.1                 # works for Edge / Azure-v2 / SiliconFlow / MiniMax voices only

  # ── Script / subject ─────────────────────────────────────────────────────
  video_subject: ""
  video_script: ""
  # video_terms: explicit stock-search keywords. When non-empty, MPT skips its
  # own English-only 5-term generator entirely — the only lever over the
  # visual row. Order matters with match_materials_to_script (round-robin
  # downloads follow this order). List or comma-separated string.
  video_terms: ""
  video_script_prompt: ""
  # custom_system_prompt fully REPLACES MPT's default script system prompt
  # (≤8000 chars). The single biggest text-quality lever — see
  # docs/recommend/04-roadmap.md (A-1) for the reasoning. Draft below follows
  # that spec: hook-first structure; word-count frame stays in
  # video_script_prompt (MPT appends it, so numbers are not duplicated here);
  # no markdown or parentheses in the OUTPUT (MPT strips them and loses real
  # text); no invented figures.
  # custom_system_prompt: |
  #   You write voiceover scripts for short vertical fact videos. Output ONLY
  #   the narration text: no markdown, no headings, no speaker notes, no
  #   parentheses, no lists, no hashtags, no emojis.
  #   Structure every script like this: one opening hook of at most 15 words
  #   that makes a shocking claim, asks a teasing question, or paints a vivid
  #   image — never a greeting, never "did you know". Then develop the fact
  #   with an open loop the viewer wants closed. Then resolve the loop. End
  #   with a kicker line that lands the point and gives a reason to rewatch.
  #   Write in the same language as the video subject. Do not invent numbers,
  #   dates, or names; when unsure of a figure, restate the fact without the
  #   number. Plain sentences only, paragraphs separated by a blank line.
  custom_system_prompt: ""
  paragraph_number: 3
  video_language: "en"

  # ── Video assembly ───────────────────────────────────────────────────────
  video_aspect: "9:16"
  video_fit_mode: "cover"           # "cover" (crop) or "contain" (pillarbox)
  video_concat_mode: "sequential"
  # "No transition" = DELETE this key (MPT's enum has no "None" member; the
  # string gets a 400). Real options: Shuffle/FadeIn/FadeOut/SlideIn/SlideOut/
  # ZoomIn/ZoomOut — a transition is fixed 1s between clips.
  video_transition_mode: "FadeIn"
  video_clip_duration: 4
  video_clip_speed: 1.0             # speed multiplier (1.0 = normal)
  # video_count > 1 silently forces random concat in MPT (overriding
  # video_concat_mode) — keep 1 unless you know that.
  video_count: 1
  # Order materials by narration + round-robin downloads across video_terms;
  # with it on, MPT forces sequential concat. Needs 8+ video_terms to shine.
  match_materials_to_script: true
  video_source: "pexels"
  # Other supported sources: "pixabay", "coverr", "wavespeed" (AI text-to-video),
  # "volcengine_seedance", "ofox" (multi-model video API), "metaso_minimax",
  # "loomloom", "openai_image", "local"
  video_materials:
    - provider: "pexels"
      url: ""
      duration: 0
  custom_audio_file: ""

  # ── Background music ─────────────────────────────────────────────────────
  bgm_type: "random"
  bgm_file: ""
  # MPT has no ducking at all — bgm_volume is the only protection for the
  # voice. 0.12 is loud enough to be heard, quiet enough to stay under speech.
  bgm_volume: 0.12
  video_music_prompt: ""          # AI-generated music prompt (Sonilo, ElevenLabs Music)
  sonilo_bgm_prompt: ""           # Legacy; use video_music_prompt instead

  # ── Subtitles ────────────────────────────────────────────────────────────
  subtitle_enabled: true
  # "custom" puts subtitles above the YouTube player controls zone.
  subtitle_position: "custom"
  subtitle_display_mode: "sentence"    # "sentence" or "word_by_word" (the latter only makes sense with Edge voices)
  subtitle_animation: "none"           # "none" or "pop_spring"
  custom_position: 72                  # percent from the top
  font_name: "BeVietnamPro-Bold.ttf"   # from MPT's resource/fonts/; covers Latin + diacritics
  rounded_subtitle_background: false    # only renders together with text_background_color below
  font_size: 72                        # default 60; 72 stays inside the frame at 9:16
  text_fore_color: "#FFFFFF"
  # The ONLY working subtitle-background lever (schema field: bool or hex;
  # true = black plate). subtitle_background_enabled/color are NOT VideoParams
  # fields — MPT silently drops them.
  text_background_color: false
  stroke_color: "#000000"
  stroke_width: 3                      # MPT truncates to int — 1.5 draws as 1; use a whole number

  # ── Rendering ────────────────────────────────────────────────────────────
  n_threads: 2

# Individual jobs.
# Required per job:
#   name        — label used in logs and Telegram alerts
#   output_file — saved filename, must be unique (added to seen.txt after success)
# Everything else overrides defaults for that job only.
jobs:
  - name: "what_air_traffic_controllers_never_tell_passengers_en"
    output_file: "what_air_traffic_controllers_never_tell_passengers_en.mp4"
    enabled: true
    video_subject: "What Air Traffic Controllers Never Tell Passengers"
    video_clip_duration: 4
    video_concat_mode: "sequential"
    voice: "gemini_aoede"   # resolves voice_name (and rate/volume if the preset sets them)
    voice_rate: 1.1
    bgm_type: "random"
    bgm_volume: 0.15
    paragraph_number: 2

  - name: "morning_routine_tips_en"
    output_file: "morning_routine_tips_en.mp4"
    enabled: true
    video_subject: "5 simple morning routine tips to boost productivity"

  - name: "sleep_better_tonight_en"
    output_file: "sleep_better_tonight_en.mp4"
    enabled: false
    video_subject: "How to fall asleep faster and wake up energized"

  # Per-job override example — Spanish via a bundled Edge TTS voice instead
  # of the Gemini default. Run `mpt batch --list-voices es` to see all
  # 45 Spanish variants (Spain, Mexico, Argentina, ...) and pick another.
  - name: "consejos_productividad_es"
    output_file: "consejos_productividad_es.mp4"
    enabled: false
    video_subject: "5 consejos para mejorar tu productividad al instante"
    video_language: "es"
    voice: "es_es_elvira"

  # Skipping presets entirely and setting voice_name directly also works —
  # `voice` is purely a convenience layer. (tts_server is not a VideoParams
  # field; setting it here does nothing.)
  - name: "sin_presets_es"
    output_file: "sin_presets_es.mp4"
    enabled: false
    video_subject: "5 consejos de productividad"
    video_language: "es"
    voice_name: "es-MX-DaliaNeural-Female"
