# MPT Autopilot — accounts.example.yaml
#
#     cp accounts.example.yaml accounts.yaml
#
# Per-channel YouTube credentials for `mpt upload`. Kept separate from
# config.yaml on purpose: it points at OAuth secrets, so it is the one file you
# are most likely to store outside the repository. accounts.yaml is gitignored.
#
# `mpt upload` looks for accounts.yaml NEXT TO config.yaml. Point somewhere else
# with `uploader.accounts_file` in config.yaml.
#
# Each key is an account name, used as: mpt upload --account <name>
# Define as many as you like — one per YouTube channel.
#
# `mpt run` maps a language to an account by name, so naming these after your
# language codes (en, es, ...) means no extra configuration. If you'd rather use
# real channel names, add a pipeline.accounts mapping in config.yaml.

accounts:
  en:
    # Where rendered videos wait to be uploaded. For `mpt run` this MUST be the
    # directory batch renders this language into — config.yaml's
    # batch.output_dir plus the language's file_suffix (so ./exports for a
    # language with an empty suffix, ./exports_es for "_es"). Nothing validates
    # the pairing; `mpt run --dry-run` is how you check it.
    videos_dir: "/your/path/to/videos/en"
    client_secrets: "/root/youtubeuploader/client_secrets_en.json"
    token_file: "/root/youtubeuploader/request.token.en"
    # Stop after this many uploads per run. YouTube's own daily quota still
    # applies and is detected separately (exit code 2).
    # daily_upload_limit: 10

  es:
    videos_dir: "/your/path/to/videos/es"
    client_secrets: "/root/youtubeuploader/client_secrets_es.json"
    token_file: "/root/youtubeuploader/request.token.es"
    # daily_upload_limit: 10
